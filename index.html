<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bet Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0d1117;--card:#161b22;--border:#30363d;
  --text:#e6edf3;--text-muted:#8b949e;--text-faint:#484f58;
  --gold:#d4a84b;--green:#3fb950;--red:#f85149;--blue:#58a6ff;--purple:#bc8cff;
  --font-body:'Inter',sans-serif;--font-mono:'JetBrains Mono',monospace;
  --radius:12px;
}
[data-theme="light"]{
  --bg:#f0f2f5;--card:#ffffff;--border:#d0d7de;
  --text:#1f2328;--text-muted:#656d76;--text-faint:#afb8c1;
  --gold:#b8860b;--green:#1a7f37;--red:#cf222e;--blue:#0969da;--purple:#8250df;
}
html{font-family:var(--font-body);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;scroll-behavior:smooth}
body{min-height:100dvh;padding:0;margin:0}
.container{max-width:900px;margin:0 auto;padding:12px 16px 40px}
.header{display:flex;align-items:center;justify-content:space-between;padding:12px 0;margin-bottom:8px}
.header h1{font-size:18px;font-weight:700;letter-spacing:-0.5px}
.header h1 span{color:var(--gold)}
.header-actions{display:flex;gap:8px;align-items:center}
.theme-toggle{width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text-muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
.theme-toggle:hover{color:var(--text);border-color:var(--text-muted)}
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.status-dot.live{background:var(--green);box-shadow:0 0 6px var(--green)}
.status-dot.offline{background:var(--text-faint)}
.status-label{font-size:11px;color:var(--text-muted);margin-left:4px}

/* Tabs */
.tabs{display:flex;gap:2px;margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-bottom:1px solid var(--border);padding-bottom:0}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{padding:8px 14px;font-size:12px;font-weight:600;color:var(--text-muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;transition:all .15s;text-transform:uppercase;letter-spacing:0.5px}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--gold);border-bottom-color:var(--gold)}
.tab-content{display:none}
.tab-content.active{display:block}

/* Cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.card-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted)}

/* KPIs */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;text-align:center}
.kpi-value{font-family:var(--font-mono);font-size:24px;font-weight:700;line-height:1.2}
.kpi-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-top:4px}
.kpi-sub{font-size:11px;color:var(--text-muted);margin-top:2px;font-family:var(--font-mono)}

/* Week Nav */
.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.week-nav button{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--card);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:16px;transition:all .15s}
.week-nav button:hover:not(:disabled){border-color:var(--gold);color:var(--gold)}
.week-nav button:disabled{opacity:.3;cursor:not-allowed}
.week-label{font-size:13px;font-weight:600;color:var(--text)}
.week-label small{display:block;font-size:11px;color:var(--text-muted);font-weight:400;margin-top:2px;text-align:center}

/* Tables */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap}
tbody td{padding:8px 10px;border-bottom:1px solid color-mix(in srgb,var(--border) 50%,transparent);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.text-green{color:var(--green)}
.text-red{color:var(--red)}
.text-blue{color:var(--blue)}
.text-gold{color:var(--gold)}
.text-purple{color:var(--purple)}
.text-muted{color:var(--text-muted)}
.text-right{text-align:right}
.text-center{text-align:center}
.font-bold{font-weight:700}

/* Status chips */
.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px}
.chip-won{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--green)}
.chip-lost{background:color-mix(in srgb,var(--red) 15%,transparent);color:var(--red)}
.chip-push{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue)}
.chip-pending{background:color-mix(in srgb,var(--text-muted) 15%,transparent);color:var(--text-muted)}

/* Day group */
.day-group{margin-bottom:16px}
.day-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint);padding:6px 0;border-bottom:1px solid var(--border);margin-bottom:0}

/* History cards */
.history-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.history-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;transition:all .15s}
.history-card:hover{border-color:var(--gold);transform:translateY(-1px)}
.history-card .week-range{font-size:11px;color:var(--text-muted);margin-bottom:6px}
.history-card .pnl{font-family:var(--font-mono);font-size:20px;font-weight:700}
.history-card .record{font-size:11px;color:var(--text-muted);margin-top:4px;font-family:var(--font-mono)}

/* Collapsible */
.collapsible{margin-bottom:12px}
.collapsible-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);cursor:pointer;transition:all .15s;user-select:none}
.collapsible-header:hover{border-color:var(--text-faint)}
.collapsible-header h3{font-size:14px;font-weight:600}
.collapsible-chevron{color:var(--text-muted);transition:transform .2s;font-size:14px}
.collapsible.open .collapsible-chevron{transform:rotate(180deg)}
.collapsible-body{max-height:0;overflow:hidden;transition:max-height .3s ease}
.collapsible.open .collapsible-body{max-height:5000px}
.collapsible-inner{padding:12px 0 0}

/* Event cards */
.event-card{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:12px;transition:all .15s}
.event-card.gold-border{border-color:var(--gold)}
.event-card .event-name{font-size:18px;font-weight:700;margin-bottom:4px}
.event-card .event-date{font-size:12px;color:var(--text-muted);margin-bottom:12px}
.event-card .event-stats{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.event-card .event-stat{text-align:center}
.event-card .event-stat-val{font-family:var(--font-mono);font-size:16px;font-weight:700}
.event-card .event-stat-label{font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted)}
.event-card .event-link{display:inline-block;padding:8px 16px;background:var(--gold);color:#000;border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;transition:all .15s}
.event-card .event-link:hover{filter:brightness(1.1);transform:translateY(-1px)}
.placeholder-card{background:var(--card);border:1px dashed var(--border);border-radius:var(--radius);padding:24px;text-align:center;color:var(--text-faint);font-size:13px}

/* Chart containers */
.chart-container{position:relative;height:280px;margin:12px 0}
.chart-container.bar{height:200px}

/* Warning banner */
.warning-banner{background:color-mix(in srgb,var(--red) 10%,transparent);border:1px solid color-mix(in srgb,var(--red) 30%,transparent);border-radius:8px;padding:10px 14px;margin:8px 0;font-size:12px;color:var(--red);display:flex;align-items:center;gap:8px}
.warning-banner svg{flex-shrink:0}

/* Best/worst highlight */
.row-best{background:color-mix(in srgb,var(--green) 8%,transparent)}
.row-worst{background:color-mix(in srgb,var(--red) 8%,transparent)}

/* Sport mini grid */
.sport-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px}
.sport-card{background:color-mix(in srgb,var(--card) 80%,var(--bg));border:1px solid var(--border);border-radius:8px;padding:10px;text-align:center}
.sport-card .sport-name{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:4px}
.sport-card .sport-pnl{font-family:var(--font-mono);font-size:16px;font-weight:700}
.sport-card .sport-record{font-size:10px;color:var(--text-muted);font-family:var(--font-mono);margin-top:2px}

/* Responsive */
@media(max-width:600px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .kpi-value{font-size:18px}
  .history-grid{grid-template-columns:1fr 1fr}
  table{font-size:12px}
  thead th,tbody td{padding:6px 6px}
  .event-card .event-stats{gap:10px}
}
</style>
</head>

</div>

// ===== CSV PARSING =====
function* csvGenerator(text) {
  let current = '';
  let fields = [];
  let inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (ch === '"') {
      if (inQuotes && text[i+1] === '"') { current += '"'; i++; }
      else inQuotes = !inQuotes;
    } else if (ch === ',' && !inQuotes) {
      fields.push(current); current = '';
    } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
      if (ch === '\r' && text[i+1] === '\n') i++;
      if (current !== '' || fields.length) { fields.push(current); yield fields; fields = []; current = ''; }
    } else {
      current += ch;
    }
  }
  if (current !== '' || fields.length) { fields.push(current); yield fields; }
}

function parseBetsCSV(text) {
  const gen = csvGenerator(text);
  const headerRow = gen.next().value;
  if (!headerRow) return [];
  const headers = headerRow.map(h => h.trim().replace(/^"|"$/g, ''));
  const bets = [];
  for (const row of gen) {
    if (row.length < headers.length) continue;
    const bet = {};
    headers.forEach((h, i) => bet[h] = (row[i] || '').trim());
    if (bet.ID && bet.Date) bets.push(bet);
  }
  return bets;
}

function normalizeBets(bets) {
  return bets.map(b => ({
    ...b,
    risk: parseFloat(b.Risk) || 0,
    toWin: parseFloat(b['To Win']) || 0,
    odds: b.Odds ? b.Odds.toString().trim() : '',
    status: (b.Status || '').toLowerCase().trim(),
    type: (b.Type || '').toLowerCase().trim(),
    sport: (b.Sport || '').trim(),
    league: (b.League || '').trim(),
    date: b.Date,
    resultDate: b['Result Date'] || '',
    notes: b.Notes || '',
    description: b.Description || '',
    pick: b.Pick || '',
    opponent: b.Opponent || '',
    event: b.Event || '',
  }));
}

// ===== DATA LOADING =====
async function loadData() {
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 5000);
    const resp = await fetch(SHEET_CSV_URL, { signal: controller.signal });
    clearTimeout(timeoutId);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const text = await resp.text();
    const parsed = parseBetsCSV(text);
    if (parsed.length > 100) {
      allBets = normalizeBets(parsed);
      setStatus(true, `${allBets.length} bets (live)`);
      return;
    }
  } catch(e) {
    console.log('Sheet fetch failed, using fallback:', e.message);
  }
  allBets = normalizeBets(FALLBACK_BETS);
  setStatus(false, `${allBets.length} bets (cached)`);
}

function setStatus(live, text) {
  const dot = document.getElementById('statusDot');
  const label = document.getElementById('statusLabel');
  dot.className = 'status-dot ' + (live ? 'live' : 'offline');
  label.textContent = text;
}

// ===== UTILITIES =====
function fmt(n, decimals=2) {
  if (n == null || isNaN(n)) return '$0.00';
  const abs = Math.abs(n);
  const s = abs.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
  return (n < 0 ? '-$' : '$') + s;
}

function fmtPnl(n) {
  if (n == null || isNaN(n)) return '<span class="mono">$0.00</span>';
  const cls = n > 0 ? 'text-green' : n < 0 ? 'text-red' : '';
  const prefix = n > 0 ? '+$' : n < 0 ? '-$' : '$';
  return `<span class="mono ${cls}">${prefix}${Math.abs(n).toLocaleString('en-US', {minimumFractionDigits:2,maximumFractionDigits:2})}</span>`;
}

function fmtRoi(roi) {
  if (roi == null || isNaN(roi)) return '<span class="mono">0.0%</span>';
  const cls = roi > 0 ? 'text-green' : roi < 0 ? 'text-red' : '';
  const sign = roi > 0 ? '+' : '';
  return `<span class="mono ${cls}">${sign}${roi.toFixed(1)}%</span>`;
}

function fmtOdds(odds) {
  if (!odds) return '';
  const s = odds.toString();
  if (s.startsWith('+')) return `<span class="mono text-green">${s}</span>`;
  if (s.startsWith('-')) return `<span class="mono text-red">${s}</span>`;
  if (parseFloat(s) > 0) return `<span class="mono text-green">+${s}</span>`;
  return `<span class="mono">${s}</span>`;
}

function chipHtml(status) {
  const map = { won: 'chip-won', lost: 'chip-lost', push: 'chip-push', pending: 'chip-pending' };
  return `<span class="chip ${map[status] || 'chip-pending'}">${status}</span>`;
}

function calcPnl(bet) {
  if (bet.status === 'won') return bet.toWin;
  if (bet.status === 'lost') return -bet.risk;
  return 0;
}

function calcStats(bets) {
  const settled = bets.filter(b => ['won','lost','push'].includes(b.status));
  const wins = settled.filter(b => b.status === 'won').length;
  const losses = settled.filter(b => b.status === 'lost').length;
  const pushes = settled.filter(b => b.status === 'push').length;
  const pending = bets.filter(b => b.status === 'pending').length;
  const wagered = settled.reduce((s,b) => s + b.risk, 0);
  const pnl = settled.reduce((s,b) => s + calcPnl(b), 0);
  const roi = wagered > 0 ? (pnl / wagered) * 100 : 0;
  const winRate = (wins + losses) > 0 ? (wins / (wins + losses)) * 100 : 0;
  return { total: bets.length, settled: settled.length, wins, losses, pushes, pending, wagered, pnl, roi, winRate };
}

// ===== WEEK LOGIC (Tue-Mon) =====
function getWeekStart(date) {
  const d = new Date(date + 'T12:00:00');
  const day = d.getDay(); // 0=Sun,1=Mon,2=Tue
  // Tue=2 is start. If day < 2 (Sun=0, Mon=1), go back to previous Tue
  let diff = day - 2;
  if (diff < 0) diff += 7;
  d.setDate(d.getDate() - diff);
  return d.toISOString().slice(0, 10);
}

function getWeekEnd(weekStart) {
  const d = new Date(weekStart + 'T12:00:00');
  d.setDate(d.getDate() + 6);
  return d.toISOString().slice(0, 10);
}

function addWeeks(dateStr, n) {
  const d = new Date(dateStr + 'T12:00:00');
  d.setDate(d.getDate() + 7 * n);
  return d.toISOString().slice(0, 10);
}

function formatDateShort(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

function formatDateFull(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
}

function formatDateDay(dateStr) {
  const d = new Date(dateStr + 'T12:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
}

function getBetsForWeek(weekStart) {
  const end = getWeekEnd(weekStart);
  return allBets.filter(b => b.date >= weekStart && b.date <= end);
}

function getAllWeekStarts() {
  const starts = new Set();
  allBets.forEach(b => { if (b.date) starts.add(getWeekStart(b.date)); });
  return [...starts].sort();
}

// ===== THIS WEEK TAB =====
function renderThisWeek() {
  const today = new Date().toISOString().slice(0, 10);
  if (!currentWeekStart) currentWeekStart = getWeekStart(today);
  const weekEnd = getWeekEnd(currentWeekStart);
  const bets = getBetsForWeek(currentWeekStart);
  const stats = calcStats(bets);
  const weeks = getAllWeekStarts();
  const idx = weeks.indexOf(currentWeekStart);
  const hasPrev = idx > 0 || (idx === -1 && currentWeekStart > weeks[0]);
  const hasNext = idx < weeks.length - 1 || (idx === -1 && currentWeekStart < weeks[weeks.length - 1]);

  // Group by day
  const byDay = {};
  bets.forEach(b => {
    if (!byDay[b.date]) byDay[b.date] = [];
    byDay[b.date].push(b);
  });
  const days = Object.keys(byDay).sort();

  let html = `
    <div class="week-nav">
      <button id="prevWeek" ${hasPrev ? '' : 'disabled'}>&larr;</button>
      <div class="week-label">
        ${formatDateShort(currentWeekStart)} — ${formatDateShort(weekEnd)}
        <small>${bets.length} bet${bets.length !== 1 ? 's' : ''}</small>
      </div>
      <button id="nextWeek" ${hasNext ? '' : 'disabled'}>&rarr;</button>
    </div>
    <div class="kpi-grid">
      <div class="kpi">
        <div class="kpi-value mono">${fmt(stats.wagered)}</div>
        <div class="kpi-label">Wagered</div>
      </div>
      <div class="kpi">
        <div class="kpi-value">${fmtPnl(stats.pnl)}</div>
        <div class="kpi-label">P&L</div>
        <div class="kpi-sub">${fmtRoi(stats.roi)} ROI</div>
      </div>
      <div class="kpi">
        <div class="kpi-value mono">${stats.winRate.toFixed(1)}%</div>
        <div class="kpi-label">Win Rate</div>
      </div>
      <div class="kpi">
        <div class="kpi-value mono" style="font-size:18px">${stats.wins}W-${stats.losses}L-${stats.pushes}P</div>
        <div class="kpi-label">Record</div>
        ${stats.pending > 0 ? `<div class="kpi-sub">${stats.pending} pending</div>` : ''}
      </div>
    </div>
  `;

  if (days.length === 0) {
    html += '<div class="card"><p style="text-align:center;color:var(--text-muted);padding:20px">No bets this week</p></div>';
  } else {
    days.forEach(day => {
      const dayBets = byDay[day];
      html += `<div class="day-group">
        <div class="day-label">${formatDateDay(day)}</div>
        <div class="table-wrap"><table>
          <thead><tr><th>Pick</th><th>Type</th><th>Odds</th><th class="text-right">Risk</th><th class="text-right">To Win</th><th>Status</th></tr></thead>
          <tbody>`;
      dayBets.forEach(b => {
        const desc = b.opponent ? `${b.pick} vs ${b.opponent}` : b.pick;
        const fullDesc = b.description ? `${desc} — ${b.description}` : desc;
        html += `<tr>
          <td title="${fullDesc.replace(/"/g, '&quot;')}">${b.pick || b.description || '—'}<br><span style="font-size:11px;color:var(--text-muted)">${b.description.substring(0,40)}${b.description.length > 40 ? '…' : ''}</span></td>
          <td><span style="font-size:11px;text-transform:uppercase;color:var(--text-muted)">${b.type}</span><br><span style="font-size:11px;color:var(--text-faint)">${b.league}</span></td>
          <td>${fmtOdds(b.odds)}</td>
          <td class="text-right mono">${fmt(b.risk)}</td>
          <td class="text-right mono">${fmt(b.toWin)}</td>
          <td>${chipHtml(b.status)}</td>
        </tr>`;
      });
      html += '</tbody></table></div></div>';
    });
  }

  document.getElementById('thisweek').innerHTML = html;

  document.getElementById('prevWeek')?.addEventListener('click', () => {
    const weeks = getAllWeekStarts();
    const idx = weeks.indexOf(currentWeekStart);
    if (idx > 0) currentWeekStart = weeks[idx - 1];
    else currentWeekStart = addWeeks(currentWeekStart, -1);
    renderThisWeek();
  });
  document.getElementById('nextWeek')?.addEventListener('click', () => {
    const weeks = getAllWeekStarts();
    const idx = weeks.indexOf(currentWeekStart);
    if (idx >= 0 && idx < weeks.length - 1) currentWeekStart = weeks[idx + 1];
    else currentWeekStart = addWeeks(currentWeekStart, 1);
    renderThisWeek();
  });
}

// ===== FUTURES TAB =====
function renderFutures() {
  const futures = allBets.filter(b => b.type === 'future' && b.status === 'pending');
  const totalRisk = futures.reduce((s,b) => s + b.risk, 0);
  const maxPayout = futures.reduce((s,b) => s + b.toWin, 0);

  let html = `
    <div class="kpi-grid" style="margin-bottom:16px">
      <div class="kpi"><div class="kpi-value mono text-red">${fmt(totalRisk)}</div><div class="kpi-label">Total Risk</div></div>
      <div class="kpi"><div class="kpi-value mono text-green">${fmt(maxPayout)}</div><div class="kpi-label">Max Payout</div></div>
      <div class="kpi"><div class="kpi-value mono">${futures.length}</div><div class="kpi-label">Open Futures</div></div>
    </div>
    <div class="card"><div class="table-wrap"><table>
      <thead><tr><th>Pick</th><th>Description</th><th>Odds</th><th class="text-right">Risk</th><th class="text-right">To Win</th></tr></thead>
      <tbody>`;
  futures.sort((a,b) => b.toWin - a.toWin).forEach(b => {
    html += `<tr>
      <td>${b.pick}</td>

      <td>${fmtOdds(b.odds)}</td>
      <td class="text-right mono">${fmt(b.risk)}</td>

// ===== HISTORY TAB =====
function renderHistory() {
  const weeks = getAllWeekStarts().reverse();
  let html = '<div class="history-grid">';
  weeks.forEach(ws => {
    const bets = getBetsForWeek(ws);
    const stats = calcStats(bets);
    const we = getWeekEnd(ws);
    const pnlCls = stats.pnl > 0 ? 'text-green' : stats.pnl < 0 ? 'text-red' : '';
    html += `<div class="history-card" data-week="${ws}">
      <div class="week-range">${formatDateShort(ws)} — ${formatDateShort(we)}</div>
      <div class="pnl ${pnlCls}">${stats.pnl >= 0 ? '+' : ''}${fmt(stats.pnl)}</div>
      <div class="record">${stats.wins}W-${stats.losses}L-${stats.pushes}P · ${fmtRoi(stats.roi)}</div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('history').innerHTML = html;

  document.querySelectorAll('.history-card').forEach(card => {
    card.addEventListener('click', () => {
      currentWeekStart = card.dataset.week;
      document.querySelector('[data-tab="thisweek"]').click();
    });
  });
}

// ===== ANALYTICS TAB =====
function renderAnalytics() {
  const settled = allBets.filter(b => ['won','lost','push'].includes(b.status));
  let html = '';

  // 1. Sport/League Breakdown
  html += collapsibleSection('sport-league', 'Sport / League Breakdown', () => {
    const groups = {};
    settled.forEach(b => {
      const key = `${b.sport} / ${b.league}`;
      if (!groups[key]) groups[key] = [];
      groups[key].push(b);
    });
    const rows = Object.entries(groups).map(([key, bets]) => {
      const s = calcStats(bets);
      return { key, ...s };
    }).sort((a,b) => b.wagered - a.wagered);

    return `<div class="card"><div class="table-wrap"><table>
      <thead><tr><th>Sport / League</th><th class="text-right">Bets</th><th class="text-right">Wagered</th><th class="text-right">P&L</th><th class="text-right">ROI</th><th class="text-right">Win Rate</th><th>Record</th></tr></thead>
      <tbody>${rows.map(r => `<tr>
        <td>${r.key}</td>
        <td class="text-right mono">${r.settled}</td>
        <td class="text-right mono">${fmt(r.wagered)}</td>
        <td class="text-right">${fmtPnl(r.pnl)}</td>
        <td class="text-right">${fmtRoi(r.roi)}</td>
        <td class="text-right mono">${r.winRate.toFixed(1)}%</td>
        <td class="mono" style="font-size:11px">${r.wins}W-${r.losses}L-${r.pushes}P</td>
      </tr>`).join('')}</tbody>
    </table></div></div>`;
  });

  // 2. Bet Type Performance
  html += collapsibleSection('bet-type', 'Bet Type Performance', () => {
    const typeMap = {};
    const golfTypes = ['r1under','r2under','r4under','r2matchup','r3matchup','r4matchup','matchup','r2threeball','r4over','r3over','r4best','top10','top20','outright'];
    settled.forEach(b => {
      let typeKey = b.type;
      if (golfTypes.includes(b.type)) typeKey = 'Golf Props';
      else if (b.type === 'parlay') typeKey = 'Parlay';
      else if (b.type === 'spread') typeKey = 'Spread';
      else if (b.type === 'moneyline') typeKey = 'Moneyline';
      else if (b.type === 'total') typeKey = 'Total';
      else if (b.type === 'prop') typeKey = 'Prop';
      else if (b.type === 'future') typeKey = 'Future';
      if (!typeMap[typeKey]) typeMap[typeKey] = [];
      typeMap[typeKey].push(b);
    });
    const rows = Object.entries(typeMap).map(([key, bets]) => {
      const s = calcStats(bets);
      return { key, ...s };
    }).sort((a,b) => b.wagered - a.wagered);

    // Find best/worst
    const withRoi = rows.filter(r => r.wagered > 0);
    const bestIdx = withRoi.length ? rows.indexOf(withRoi.reduce((a,b) => a.roi > b.roi ? a : b)) : -1;
    const worstIdx = withRoi.length ? rows.indexOf(withRoi.reduce((a,b) => a.roi < b.roi ? a : b)) : -1;

    return `<div class="card"><div class="table-wrap"><table>
      <thead><tr><th>Type</th><th class="text-right">Bets</th><th class="text-right">Wagered</th><th class="text-right">P&L</th><th class="text-right">ROI</th><th class="text-right">Win Rate</th></tr></thead>
      <tbody>${rows.map((r, i) => `<tr class="${i === bestIdx ? 'row-best' : i === worstIdx ? 'row-worst' : ''}">
        <td>${r.key} ${i === bestIdx ? '<span style="font-size:10px;color:var(--green)">★ BEST</span>' : i === worstIdx ? '<span style="font-size:10px;color:var(--red)">▼ WORST</span>' : ''}</td>
        <td class="text-right mono">${r.settled}</td>
        <td class="text-right mono">${fmt(r.wagered)}</td>
        <td class="text-right">${fmtPnl(r.pnl)}</td>
        <td class="text-right">${fmtRoi(r.roi)}</td>
        <td class="text-right mono">${r.winRate.toFixed(1)}%</td>
      </tr>`).join('')}</tbody>
    </table></div></div>`;
  });

  // 3. Live vs Pre-Game
  html += collapsibleSection('live-pregame', 'Live vs Pre-Game', () => {
    const live = settled.filter(b => b.notes && (b.notes.toLowerCase().includes('live bet') || b.notes.toLowerCase().includes('live ')));
    const pregame = settled.filter(b => !b.notes || (!b.notes.toLowerCase().includes('live bet') && !b.notes.toLowerCase().includes('live ')));
    const liveS = calcStats(live);
    const preS = calcStats(pregame);

    const warningHtml = liveS.roi < -20 ? `<div class="warning-banner">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      Live betting has a ${liveS.roi.toFixed(1)}% ROI — consider reducing live bet volume
    </div>` : '';

    return `${warningHtml}<div class="card"><div class="table-wrap"><table>
      <thead><tr><th>Category</th><th class="text-right">Bets</th><th class="text-right">Wagered</th><th class="text-right">P&L</th><th class="text-right">ROI</th><th class="text-right">Win Rate</th><th>Record</th></tr></thead>
      <tbody>
        <tr><td>Pre-Game</td><td class="text-right mono">${preS.settled}</td><td class="text-right mono">${fmt(preS.wagered)}</td><td class="text-right">${fmtPnl(preS.pnl)}</td><td class="text-right">${fmtRoi(preS.roi)}</td><td class="text-right mono">${preS.winRate.toFixed(1)}%</td><td class="mono" style="font-size:11px">${preS.wins}W-${preS.losses}L-${preS.pushes}P</td></tr>
        <tr style="${liveS.roi < -20 ? 'background:color-mix(in srgb,var(--red) 8%,transparent)' : ''}"><td>Live Bets</td><td class="text-right mono">${liveS.settled}</td><td class="text-right mono">${fmt(liveS.wagered)}</td><td class="text-right">${fmtPnl(liveS.pnl)}</td><td class="text-right">${fmtRoi(liveS.roi)}</td><td class="text-right mono">${liveS.winRate.toFixed(1)}%</td><td class="mono" style="font-size:11px">${liveS.wins}W-${liveS.losses}L-${liveS.pushes}P</td></tr>
      </tbody>
    </table></div></div>`;
  });

  // 4. Parlay Breakdown
  html += collapsibleSection('parlay-breakdown', 'Parlay Breakdown', () => {
    const parlays = settled.filter(b => b.type === 'parlay');
    const byLegs = { '2-leg': [], '3-leg': [], '4-leg': [], '5+-leg': [], 'Round Robin': [] };
    parlays.forEach(b => {
      const desc = b.description.toLowerCase();
      if (desc.includes('rr ') || desc.includes('round robin')) {
        byLegs['Round Robin'].push(b);
      } else {
        const m = b.description.match(/(\d+)-leg/);
        if (m) {
          const n = parseInt(m[1]);
          if (n <= 2) byLegs['2-leg'].push(b);
          else if (n === 3) byLegs['3-leg'].push(b);
          else if (n === 4) byLegs['4-leg'].push(b);
          else byLegs['5+-leg'].push(b);
        } else {
          byLegs['2-leg'].push(b); // default
        }
      }
    });

    const rows = Object.entries(byLegs).filter(([,v]) => v.length > 0).map(([key, bets]) => {
      const s = calcStats(bets);
      return { key, ...s };
    });

    return `<div class="card"><div class="table-wrap"><table>
      <thead><tr><th>Type</th><th class="text-right">Count</th><th class="text-right">Wagered</th><th class="text-right">P&L</th><th class="text-right">ROI</th><th class="text-right">Hit Rate</th></tr></thead>
      <tbody>${rows.map(r => `<tr>
        <td>${r.key}</td>
        <td class="text-right mono">${r.settled}</td>
        <td class="text-right mono">${fmt(r.wagered)}</td>
        <td class="text-right">${fmtPnl(r.pnl)}</td>
        <td class="text-right">${fmtRoi(r.roi)}</td>
        <td class="text-right mono">${r.winRate.toFixed(1)}%</td>
      </tr>`).join('')}</tbody>
    </table></div></div>`;
  });

  // 5. Monthly P&L Chart
  html += collapsibleSection('monthly-pnl', 'Monthly P&L', () => {
    return `<div class="card">
      <div class="chart-container"><canvas id="cumulativeChart"></canvas></div>
    </div>
    <div class="card" style="margin-top:12px">
      <div class="chart-container bar"><canvas id="monthlyBarChart"></canvas></div>
    </div>`;
  });

  // 6. Yearly Summary
  html += collapsibleSection('yearly-summary', 'Yearly Summary', () => {
    const years = {};
    settled.forEach(b => {
      const y = b.date.substring(0, 4);
      if (!years[y]) years[y] = [];
      years[y].push(b);
    });

    return `<div class="kpi-grid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr))">${
      Object.keys(years).sort().map(y => {
        const s = calcStats(years[y]);
        const pnlCls = s.pnl > 0 ? 'text-green' : s.pnl < 0 ? 'text-red' : '';
        return `<div class="kpi" style="text-align:left;padding:16px">
          <div style="font-size:20px;font-weight:700;margin-bottom:8px;color:var(--gold)">${y}</div>
          <div style="font-size:12px;color:var(--text-muted);margin-bottom:2px">Bets: <span class="mono">${s.settled}</span></div>
          <div style="font-size:12px;color:var(--text-muted);margin-bottom:2px">Wagered: <span class="mono">${fmt(s.wagered)}</span></div>
          <div style="font-size:12px;margin-bottom:2px">P&L: ${fmtPnl(s.pnl)}</div>
          <div style="font-size:12px;margin-bottom:2px">ROI: ${fmtRoi(s.roi)}</div>
          <div style="font-size:11px;color:var(--text-muted);font-family:var(--font-mono)">${s.wins}W-${s.losses}L-${s.pushes}P</div>
        </div>`;
      }).join('')
    }</div>`;
  });

  document.getElementById('analytics').innerHTML = html;

  // Init collapsibles
  document.querySelectorAll('.collapsible-header').forEach(h => {
    h.addEventListener('click', () => {
      const parent = h.parentElement;
      parent.classList.toggle('open');
    });
  });

  // Default all open
  document.querySelectorAll('.collapsible').forEach(c => c.classList.add('open'));

  // Render charts after DOM update
  setTimeout(renderCharts, 100);
}

function collapsibleSection(id, title, contentFn) {
  return `<div class="collapsible" id="section-${id}">
    <div class="collapsible-header">
      <h3>${title}</h3>
      <span class="collapsible-chevron">&#9660;</span>
    </div>
    <div class="collapsible-body"><div class="collapsible-inner">${contentFn()}</div></div>
  </div>`;
}

function renderCharts() {
  const settled = allBets.filter(b => ['won','lost','push'].includes(b.status) && b.date);
  settled.sort((a,b) => a.date.localeCompare(b.date));

  // Group by month
  const months = {};
  settled.forEach(b => {
    const m = b.date.substring(0, 7); // YYYY-MM
    if (!months[m]) months[m] = 0;
    months[m] += calcPnl(b);
  });

  const monthKeys = Object.keys(months).sort();
  const monthLabels = monthKeys.map(k => {
    const [y, m] = k.split('-');
    return new Date(parseInt(y), parseInt(m)-1).toLocaleDateString('en-US', { month: 'short', year: '2-digit' });
  });
  const monthlyPnl = monthKeys.map(k => months[k]);
  let cumulative = 0;
  const cumulativePnl = monthlyPnl.map(v => { cumulative += v; return cumulative; });

  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const gridColor = isDark ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.08)';
  const textColor = isDark ? '#8b949e' : '#656d76';

  const ctx1 = document.getElementById('cumulativeChart')?.getContext('2d');
  if (ctx1) {
    if (cumulativeChart) cumulativeChart.destroy();
    cumulativeChart = new Chart(ctx1, {
      type: 'line',
      data: {
        labels: monthLabels,
        datasets: [{
          label: 'Cumulative P&L',
          data: cumulativePnl,
          borderColor: '#d4a84b',
          backgroundColor: 'rgba(212,168,75,0.1)',
          fill: true,
          tension: 0.3,
          pointRadius: 2,
          pointHoverRadius: 5,
          borderWidth: 2
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => '$' + ctx.parsed.y.toLocaleString('en-US', {minimumFractionDigits:2})
            }
          }
        },
        scales: {
          x: { ticks: { color: textColor, font: { size: 10 }, maxRotation: 45 }, grid: { color: gridColor } },
          y: { ticks: { color: textColor, font: { family: "'JetBrains Mono'" }, callback: v => '$' + v.toLocaleString() }, grid: { color: gridColor } }
        }
      }
    });
  }

  const ctx2 = document.getElementById('monthlyBarChart')?.getContext('2d');
  if (ctx2) {
    if (monthlyBarChart) monthlyBarChart.destroy();
    monthlyBarChart = new Chart(ctx2, {
      type: 'bar',
      data: {
        labels: monthLabels,
        datasets: [{
          label: 'Monthly P&L',
          data: monthlyPnl,
          backgroundColor: monthlyPnl.map(v => v >= 0 ? 'rgba(63,185,80,0.7)' : 'rgba(248,81,73,0.7)'),
          borderColor: monthlyPnl.map(v => v >= 0 ? '#3fb950' : '#f85149'),
          borderWidth: 1,
          borderRadius: 4
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: ctx => (ctx.parsed.y >= 0 ? '+' : '') + '$' + Math.abs(ctx.parsed.y).toLocaleString('en-US', {minimumFractionDigits:2})
            }
          }
        },
        scales: {
          x: { ticks: { color: textColor, font: { size: 10 }, maxRotation: 45 }, grid: { display: false } },
          y: { ticks: { color: textColor, font: { family: "'JetBrains Mono'" }, callback: v => '$' + v.toLocaleString() }, grid: { color: gridColor } }
        }
      }
    });
  }
}

function updateChartsTheme() {
  if (cumulativeChart || monthlyBarChart) renderCharts();
}

// ===== EVENTS TAB =====
function renderEvents() {
  // Masters event card
  let html = `
    <div class="event-card gold-border">
      <div class="event-name" style="color:var(--gold)">&#9971; 2026 Masters</div>
      <div class="event-date">Apr 6–12, 2026 · Augusta National Golf Club</div>
      <div class="event-stats">
        <div class="event-stat"><div class="event-stat-val mono">99</div><div class="event-stat-label">Bets</div></div>
        <div class="event-stat"><div class="event-stat-val mono text-green">+$3,290.57</div><div class="event-stat-label">P&L</div></div>
        <div class="event-stat"><div class="event-stat-val mono text-green">+12.6%</div><div class="event-stat-label">ROI</div></div>
        <div class="event-stat"><div class="event-stat-val mono">41W-56L-2P</div><div class="event-stat-label">Record</div></div>
      </div>
      <a href="https://nritchey23-a11y.github.io/masters-2026-tracker/" target="_blank" rel="noopener" class="event-link">View Dashboard &rarr;</a>
    </div>
    <div class="placeholder-card">More events coming soon</div>
  `;

  // Masters week mini-table: Golf/PGA Tour bets during Masters week
  const mastersBets = allBets.filter(b =>
    b.event && b.event.toLowerCase().includes('masters') ||
    (b.sport === 'Golf' && b.league === 'PGA Tour' && b.date >= '2026-04-06' && b.date <= '2026-04-13')
  ).filter(b => ['won','lost','push'].includes(b.status));

  if (mastersBets.length > 0) {
    const ms = calcStats(mastersBets);
    html += `
      <div style="margin-top:20px">
        <h3 style="font-size:14px;font-weight:600;margin-bottom:12px;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.5px">Masters Week Bets (from tracker data)</h3>
        <div class="kpi-grid" style="margin-bottom:12px">
          <div class="kpi"><div class="kpi-value mono">${ms.settled}</div><div class="kpi-label">Bets</div></div>
          <div class="kpi"><div class="kpi-value">${fmtPnl(ms.pnl)}</div><div class="kpi-label">P&L</div></div>
          <div class="kpi"><div class="kpi-value">${fmtRoi(ms.roi)}</div><div class="kpi-label">ROI</div></div>
        </div>
        <div class="card"><div class="table-wrap"><table>
          <thead><tr><th>Date</th><th>Pick</th><th>Type</th><th>Odds</th><th class="text-right">Risk</th><th class="text-right">To Win</th><th>Status</th></tr></thead>
          <tbody>`;
    mastersBets.sort((a,b) => a.date.localeCompare(b.date)).forEach(b => {
      html += `<tr>
        <td style="font-size:11px;color:var(--text-muted);white-space:nowrap">${formatDateShort(b.date)}</td>
        <td>${b.pick}<br><span style="font-size:11px;color:var(--text-muted)">${b.description.substring(0,35)}${b.description.length > 35 ? '…' : ''}</span></td>
        <td style="font-size:11px;text-transform:uppercase;color:var(--text-muted)">${b.type}</td>
        <td>${fmtOdds(b.odds)}</td>
        <td class="text-right mono">${fmt(b.risk)}</td>
        <td class="text-right mono">${fmt(b.toWin)}</td>
        <td>${chipHtml(b.status)}</td>
      </tr>`;
    });
    html += '</tbody></table></div></div></div>';
  }

  document.getElementById('events').innerHTML = html;
}

// ===== ALL-TIME TAB =====
function renderAllTime() {
  const settled = allBets.filter(b => ['won','lost','push'].includes(b.status));
  const stats = calcStats(allBets);

  // Best and worst week
  const weeks = getAllWeekStarts();
  let bestWeek = null, worstWeek = null, bestPnl = -Infinity, worstPnl = Infinity;
  weeks.forEach(ws => {
    const s = calcStats(getBetsForWeek(ws));
    if (s.pnl > bestPnl) { bestPnl = s.pnl; bestWeek = ws; }
    if (s.pnl < worstPnl) { worstPnl = s.pnl; worstWeek = ws; }
  });

  let html = `
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-value mono">${fmt(stats.wagered)}</div><div class="kpi-label">Total Wagered</div></div>
      <div class="kpi"><div class="kpi-value">${fmtPnl(stats.pnl)}</div><div class="kpi-label">Net P&L</div><div class="kpi-sub">${fmtRoi(stats.roi)} ROI</div></div>
      <div class="kpi"><div class="kpi-value mono">${stats.winRate.toFixed(1)}%</div><div class="kpi-label">Win Rate</div></div>
      <div class="kpi"><div class="kpi-value mono" style="font-size:16px">${stats.wins}W-${stats.losses}L-${stats.pushes}P</div><div class="kpi-label">Record</div><div class="kpi-sub">${stats.pending} pending</div></div>
    </div>
    <div class="kpi-grid" style="grid-template-columns:1fr 1fr">
      <div class="kpi" style="border-left:3px solid var(--green)">
        <div class="kpi-value text-green mono" style="font-size:18px">${fmt(bestPnl)}</div>
        <div class="kpi-label">Best Week</div>
        <div class="kpi-sub">${bestWeek ? formatDateShort(bestWeek) + ' — ' + formatDateShort(getWeekEnd(bestWeek)) : ''}</div>
      </div>
      <div class="kpi" style="border-left:3px solid var(--red)">
        <div class="kpi-value text-red mono" style="font-size:18px">${fmt(worstPnl)}</div>
        <div class="kpi-label">Worst Week</div>
        <div class="kpi-sub">${worstWeek ? formatDateShort(worstWeek) + ' — ' + formatDateShort(getWeekEnd(worstWeek)) : ''}</div>
      </div>
    </div>
  `;

  // Sport breakdown mini-grid
  const bySport = {};
  settled.forEach(b => {
    if (!bySport[b.sport]) bySport[b.sport] = [];
    bySport[b.sport].push(b);
  });

  html += '<h3 style="font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin:16px 0 8px">By Sport</h3>';
  html += '<div class="sport-grid">';
  Object.entries(bySport).sort((a,b) => {
    const sa = calcStats(a[1]), sb = calcStats(b[1]);
    return sb.wagered - sa.wagered;
  }).forEach(([sport, bets]) => {
    const s = calcStats(bets);
    const pnlCls = s.pnl > 0 ? 'text-green' : s.pnl < 0 ? 'text-red' : '';
    html += `<div class="sport-card">
      <div class="sport-name">${sport}</div>
      <div class="sport-pnl ${pnlCls}">${s.pnl >= 0 ? '+' : ''}${fmt(s.pnl)}</div>
      <div class="sport-record">${s.wins}W-${s.losses}L-${s.pushes}P</div>
      <div style="font-size:10px;color:var(--text-faint);margin-top:2px">${fmtRoi(s.roi)} · ${fmt(s.wagered)}</div>
    </div>`;
  });
  html += '</div>';

  document.getElementById('alltime').innerHTML = html;
}

// ===== INIT =====
async function init() {
  await loadData();
  renderThisWeek();
  renderFutures();
  renderHistory();
  renderAllTime();
  // Render analytics/events if already on those tabs
  const activeTab = document.querySelector('.tab-btn.active');
  if (activeTab && activeTab.dataset.tab === 'analytics') renderAnalytics();
  if (activeTab && activeTab.dataset.tab === 'events') renderEvents();
}

init();
</script>
